# Deploys On Belay from its private source (justinthomae/bcss, folder OnBelay/) to this repository, which GitHub
# Pages serves at https://onbelay.grudgematchgames.com. It runs here, in the public site repository, because
# Actions minutes are free for public repositories.
#
#   * Every hour it checks the source branch; when OnBelay/ has changed it deploys. Run it by hand any time:
#     Actions > Deploy On Belay > Run workflow (a manual run always deploys).
#   * Backend: applies the database migrations to the `onbelay` schema of the shared Supabase project, deploys the
#     `onbelay-game-action` Edge Function, appends (never replaces) project settings, and smoke-tests the result.
#     The project is shared with BoomTown, so nothing outside the onbelay schema is created or changed, except that
#     guest (anonymous) sign-ins are switched on. See OnBelay/DEPLOYMENT.md in the source.
#   * Site: builds with the project's public URL and anon/publishable key and commits the result here.
#
# Settings (this repository > Settings > Secrets and variables > Actions):
#   secret   BCSS_READ_TOKEN         fine-grained GitHub token: repository justinthomae/bcss, Contents read-only
#   variable SUPABASE_PROJECT_REF    the Supabase project's reference ID (the xxxx in https://xxxx.supabase.co)
#   secret   SUPABASE_ACCESS_TOKEN   Supabase personal access token
#   secret   ONBELAY_DB_URL          the project's "Session pooler" connection string, password filled in
# Without the three Supabase settings the site is still built and published, offline-only.
# Logs here are public: nothing secret is printed (GitHub also masks secret values), and the anon key is public.
name: Deploy On Belay

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE: https://onbelay.grudgematchgames.com
      SOURCE_REPO: justinthomae/bcss
      SOURCE_BRANCH: claude/new-project-vnrnan
      SOURCE_TOKEN: ${{ secrets.BCSS_READ_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ONBELAY_DB_URL: ${{ secrets.ONBELAY_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Fetch source
        id: src
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "::error::Add the BCSS_READ_TOKEN secret (read-only token for $SOURCE_REPO)."; exit 1; }
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git" src
          tree=$(git -C src rev-parse HEAD:OnBelay)
          echo "commit=$(git -C src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          last=$(cat site/.source-tree 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$tree" = "$last" ]; then
            echo "OnBelay/ unchanged since the last deploy; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          online=false
          if [ -n "$PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ONBELAY_DB_URL" ]; then online=true
          else echo "::notice::Online play stays off: set SUPABASE_PROJECT_REF (variable), SUPABASE_ACCESS_TOKEN and ONBELAY_DB_URL (secrets)."; fi
          echo "online=$online" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.src.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/OnBelay/package-lock.json

      - name: Install and test
        if: steps.src.outputs.run == 'true'
        working-directory: src/OnBelay
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/engine tests/offline

      - uses: supabase/setup-cli@v1
        if: steps.src.outputs.run == 'true' && steps.src.outputs.online == 'true'
        with:
          version: latest

      - name: Database (onbelay schema only)
        if: steps.src.outputs.run == 'true' && steps.src.outputs.online == 'true'
        working-directory: src/OnBelay
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          scripts/db-migrate.sh "$ONBELAY_DB_URL"

      - name: Game server function
        if: steps.src.outputs.run == 'true' && steps.src.outputs.online == 'true'
        working-directory: src/OnBelay
        run: |
          set -euo pipefail
          supabase functions deploy onbelay-game-action --project-ref "$PROJECT_REF"
          supabase secrets set --project-ref "$PROJECT_REF" "ONBELAY_ALLOWED_ORIGINS=$SITE"

      - name: Project settings (append only)
        if: steps.src.outputs.run == 'true' && steps.src.outputs.online == 'true'
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          # Expose the onbelay schema to the REST API, keeping every schema already exposed.
          schemas=$(curl -fsS "${auth[@]}" "$api/postgrest" | jq -r '.db_schema')
          if ! tr ',' '\n' <<< "$schemas" | sed 's/ //g' | grep -qx onbelay; then
            curl -fsS -X PATCH "${auth[@]}" "$api/postgrest" -d "$(jq -n --arg s "$schemas,onbelay" '{db_schema: $s}')" -o /dev/null
            echo "Exposed schemas: $schemas,onbelay"
          fi
          # Guest sign-ins on; add the site to the redirect allow-list. Site URL and email settings are left alone.
          allow=$(curl -fsS "${auth[@]}" "$api/config/auth" | jq -r '.uri_allow_list // ""')
          if ! tr ',' '\n' <<< "$allow" | grep -qx "$SITE/\*\*"; then allow="${allow:+$allow,}$SITE/**"; fi
          curl -fsS -X PATCH "${auth[@]}" "$api/config/auth" \
            -d "$(jq -n --arg a "$allow" '{external_anonymous_users_enabled: true, uri_allow_list: $a}')" -o /dev/null

      - name: Read the project's public key
        if: steps.src.outputs.run == 'true' && steps.src.outputs.online == 'true'
        run: |
          set -euo pipefail
          keys=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys")
          anon=$(jq -r '[.[] | select(.name == "anon" or .type == "publishable") | .api_key][0] // empty' <<< "$keys")
          test -n "$anon" || { echo "::error::No anon/publishable key found for the project"; exit 1; }
          echo "VITE_SUPABASE_URL=https://$PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"

      - name: Smoke test the live backend
        if: steps.src.outputs.run == 'true' && steps.src.outputs.online == 'true'
        run: |
          set -euo pipefail
          # A guest can sign in, read the route table through RLS, and reach the game server.
          token=$(curl -fsS -X POST "$VITE_SUPABASE_URL/auth/v1/signup" -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' | jq -r '.access_token // empty')
          test -n "$token" || { echo "::error::Anonymous sign-in failed"; exit 1; }
          echo "::add-mask::$token"
          routes=$(curl -fsS "$VITE_SUPABASE_URL/rest/v1/route_definitions?select=id" -H "Accept-Profile: onbelay" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $token")
          echo "routes: $routes"
          test "$(jq length <<< "$routes")" -ge 3 || { echo "::error::Route table missing or unreadable"; exit 1; }
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/functions/v1/onbelay-game-action" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -H "Origin: $SITE" -d '{}')
          echo "onbelay-game-action $code: $(cat resp.json)"
          [ "$code" = 400 ] || { echo "::error::onbelay-game-action should reject an empty request with 400"; exit 1; }

      - name: Build site
        if: steps.src.outputs.run == 'true'
        working-directory: src/OnBelay
        run: npm run build

      - name: Publish
        if: steps.src.outputs.run == 'true'
        working-directory: site
        env:
          COMMIT: ${{ steps.src.outputs.commit }}
          TREE: ${{ steps.src.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "onbelay.grudgematchgames.com" || { echo "::error::Unexpected CNAME"; exit 1; }
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name CNAME ! -name .nojekyll -exec rm -rf {} +
          cp -r ../src/OnBelay/dist/. .
          find . -name '*.map' -delete
          echo "$TREE" > .source-tree
          online=$([ -n "${VITE_SUPABASE_URL:-}" ] && echo "online play on" || echo "offline only")
          printf '# On Belay — published site\n\nBuilt game served by GitHub Pages at %s (%s).\n\nSource: `OnBelay/` in justinthomae/bcss (commit %s). Built and published by the "Deploy On Belay" workflow in this repository; do not edit the site files by hand.\n' \
            "$SITE" "$online" "$COMMIT" > README.md
          git config user.name "On Belay deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Publish On Belay from $COMMIT ($online)"
          git push -q origin HEAD:main
