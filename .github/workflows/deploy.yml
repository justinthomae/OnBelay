# Deploys On Belay from its private source (justinthomae/bcss, folder OnBelay/) to this repository, which GitHub
# Pages serves at https://onbelay.grudgematchgames.com. It runs here, in the public site repository, because
# Actions minutes are free for public repositories.
#
#   * Every hour it checks the source branch; when OnBelay/ has changed it deploys. Run it by hand any time:
#     Actions > Deploy On Belay > Run workflow (a manual run always deploys).
#   * Game server: deploys OnBelay/server (a Cloudflare Worker with Durable Objects, free plan) with
#     `wrangler deploy`, then plays one smoke-test round against the live server.
#   * Site: builds with the server's URL and commits the result here.
#
# Settings (this repository > Settings > Secrets and variables > Actions):
#   secret   BCSS_READ_TOKEN         fine-grained GitHub token: repository justinthomae/bcss, Contents read-only
#   secret   CLOUDFLARE_API_TOKEN    Cloudflare API token from the "Edit Cloudflare Workers" template
#   variable CLOUDFLARE_ACCOUNT_ID   the Cloudflare account ID (Workers & Pages overview, right-hand side)
# Without the two Cloudflare settings the site is still built and published, offline-only.
# Logs here are public: nothing secret is printed (GitHub also masks secret values).
name: Deploy On Belay

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE: https://onbelay.grudgematchgames.com
      SOURCE_REPO: justinthomae/bcss
      SOURCE_BRANCH: claude/new-project-vnrnan
      SOURCE_TOKEN: ${{ secrets.BCSS_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Fetch source
        id: src
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "::error::Add the BCSS_READ_TOKEN secret (read-only token for $SOURCE_REPO)."; exit 1; }
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git" src
          tree=$(git -C src rev-parse HEAD:OnBelay)
          echo "commit=$(git -C src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          last=$(cat site/.source-tree 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$tree" = "$last" ]; then
            echo "OnBelay/ unchanged since the last deploy; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          online=false
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then online=true
          else echo "::notice::Online play stays off: set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable."; fi
          echo "online=$online" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.src.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/OnBelay/package-lock.json

      - name: Install and test
        if: steps.src.outputs.run == 'true'
        working-directory: src/OnBelay
        run: |
          npm ci
          npm run typecheck
          npm run typecheck:server
          npx vitest run tests/engine tests/offline tests/server/room.test.ts

      - name: Deploy the game server
        if: steps.src.outputs.run == 'true' && steps.src.outputs.online == 'true'
        working-directory: src/OnBelay
        run: |
          set -euo pipefail
          npx wrangler deploy --config server/wrangler.toml --var "ALLOWED_ORIGINS:$SITE" 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          test -n "$url" || { echo "::error::No workers.dev URL in the deploy output. In the Cloudflare dashboard, open Workers & Pages once to choose a workers.dev subdomain, then run this again."; exit 1; }
          echo "Game server: $url"
          echo "VITE_ONLINE_URL=$url" >> "$GITHUB_ENV"

      - name: Smoke test the live game server
        if: steps.src.outputs.run == 'true' && steps.src.outputs.online == 'true'
        run: |
          node --input-type=module -e '
            const B = process.env.VITE_ONLINE_URL;
            const origin = process.env.SITE;
            const json = async (r) => ({ status: r.status, body: await r.json() });
            let health;
            for (let i = 0; i < 20; i++) {
              health = await fetch(`${B}/health`).catch(() => null);
              if (health?.ok) break;
              await new Promise((r) => setTimeout(r, 3000));
            }
            if (!health?.ok) throw new Error("server not answering");
            const guest = async () => (await json(await fetch(`${B}/api/guest`, { method: "POST", headers: { origin } }))).body;
            const act = async (t, body) => json(await fetch(`${B}/api/action`, { method: "POST", headers: { origin, authorization: `Bearer ${t}`, "content-type": "application/json" }, body: JSON.stringify(body) }));
            const view = async (t, id) => json(await fetch(`${B}/api/games/${id}`, { headers: { origin, authorization: `Bearer ${t}` } }));
            const check = (ok, what) => { if (!ok) throw new Error(`smoke test failed: ${what}`); console.log(`ok - ${what}`); };
            const a = await guest(), b = await guest();
            const c = await act(a.token, { action: "create", routeId: "first-ascent", preferredRole: "climber", nickname: "Smoke A", avatar: "summit" });
            check(c.status === 200 && /^[A-Z2-9]{6}$/.test(c.body.roomCode), "create a room");
            check((await act(b.token, { action: "join", roomCode: c.body.roomCode, nickname: "Smoke B", avatar: "pine" })).status === 200, "join by code");
            check((await act(a.token, { action: "start", gameId: c.body.gameId })).status === 200, "start");
            const s = (card) => ({ gameId: c.body.gameId, action: "submit", round: 1, stateVersion: 1, submission: card });
            check((await act(a.token, s({ role: "climber", action: "REACH", signal: null, teamworkPolicy: "NEVER" }))).body.resolved === false, "climber locks in");
            const seen = await view(b.token, c.body.gameId);
            check(seen.body.view.committed.climber && !/"action":"REACH"/.test(JSON.stringify(seen.body)), "partner sees the commit but not the card");
            check((await act(b.token, s({ role: "belayer", action: "FEED", signal: null, teamworkPolicy: "NEVER" }))).body.resolved === true, "round resolves");
            check((await view(a.token, c.body.gameId)).body.view.state.round === 2, "both reach round 2");
            const outsider = await guest();
            check((await view(outsider.token, c.body.gameId)).status === 404, "outsiders cannot read the game");
            await act(a.token, { action: "forfeit", gameId: c.body.gameId });
          '

      - name: Build site
        if: steps.src.outputs.run == 'true'
        working-directory: src/OnBelay
        run: npm run build

      - name: Publish
        if: steps.src.outputs.run == 'true'
        working-directory: site
        env:
          COMMIT: ${{ steps.src.outputs.commit }}
          TREE: ${{ steps.src.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "onbelay.grudgematchgames.com" || { echo "::error::Unexpected CNAME"; exit 1; }
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name CNAME ! -name .nojekyll -exec rm -rf {} +
          cp -r ../src/OnBelay/dist/. .
          find . -name '*.map' -delete
          echo "$TREE" > .source-tree
          online=$([ -n "${VITE_ONLINE_URL:-}" ] && echo "online play on" || echo "offline only")
          printf '# On Belay — published site\n\nBuilt game served by GitHub Pages at %s (%s).\n\nSource: `OnBelay/` in justinthomae/bcss (commit %s). Built and published by the "Deploy On Belay" workflow in this repository; do not edit the site files by hand.\n' \
            "$SITE" "$online" "$COMMIT" > README.md
          git config user.name "On Belay deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Publish On Belay from $COMMIT ($online)"
          git push -q origin HEAD:main
